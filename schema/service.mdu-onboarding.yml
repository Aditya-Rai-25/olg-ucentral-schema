description: |
  Configure MDU onboarding integration parameters.

  This service provides the information required to integrate a captive/onboarding
  portal workflow for MDU deployments (for example PPSK registration).
type: object
properties:
  ppsk-registration-url:
    description: |
      URL of the PPSK registration endpoint.
    type: string
    format: uri
    examples:
    - "http://157.20.214.249/login/ppsk_register/index.html"
  server-ip:
    description: |
      IP address of the onboarding server.
    type: string
    format: uc-ip
    examples:
    - "157.20.214.249"
required:
  - ppsk-registration-url
  - server-ip
